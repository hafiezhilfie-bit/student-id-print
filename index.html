  <!-- ========================================== -->

  <style>


@import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');
    :root {
      --bg: #f4f7fb;
      --card: #fff;
      --text: #172033;
      --muted: #687386;
      --primary: #315efb;
      --primary2: #7048e8;
      --danger: #d63939;
      --border: #e3e8f0;
      --shadow: 0 12px 35px rgba(28,39,65,.10);
      --radius: 18px;
    }
    
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .app { min-height: 100vh; }
    
    /* Layout Header & Navigation */
    .topbar { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.94); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { font-weight: 800; font-size: 18px; }
    .brand small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .nav { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav button, .btn { border: 0; border-radius: 12px; padding: 10px 14px; font-weight: 700; background: #edf1f7; color: var(--text); }
    .nav button.active, .btn.primary { color: #fff; background: linear-gradient(135deg, var(--primary), var(--primary2)); }
    .btn.danger { background: #fff0f0; color: var(--danger); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    
    /* Main Content Area */
    main { width: min(1280px, calc(100% - 28px)); margin: 24px auto 60px; }
    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 18px; }
    .page-head h1 { margin: 0; font-size: 26px; }
    .page-head p { margin: 5px 0 0; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
    .stat strong { font-size: 28px; display: block; }
    .stat span { color: var(--muted); font-size: 13px; }
    
    /* Toolbar & Student Grid */
    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
    .search { flex: 1; min-width: 220px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 13px; background: #fff; outline: none; }
    .search:focus, input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(49,94,251,.10); }
    .student-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
    .student-card { overflow: hidden; padding: 12px; cursor: pointer; transition: .2s; display: flex; align-items: flex-start; gap: 12px; }
    .student-card:hover { transform: translateY(-2px); }
    .student-photo { width: 48px; height: 48px; min-width: 48px; object-fit: cover; border-radius: 12px; background: #eef2f7; }
    .student-body { padding: 0; min-width: 0; flex: 1; }
    .student-body h3 { margin: 0 0 7px; overflow-wrap: anywhere; }
    .meta { color: var(--muted); font-size: 13px; line-height: 1.65; }
    .actions { display: flex; gap: 8px; margin-top: 13px; }
    .actions .btn { flex: 1; }
    .empty { text-align: center; padding: 45px 20px; color: var(--muted); }
    
    /* Forms & Photo Elements */
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; }
    .field input, .field select, .field textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 12px; background: #fff; outline: none; }
    .field.full { grid-column: 1/-1; }
    .field textarea { min-height: 90px; resize: vertical; }
    .photo-actions { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 24px; }
    .photo-preview { width: 120px; height: 120px; object-fit: cover; border-radius: 15px; border: 1px solid var(--border); background: #eef2f7; margin-top: 12px; display: block; }
    
    /* Floating Labels */
    .field.floating { position: relative; }
    .field.floating>label { position: absolute; left: 12px; top: 11px; margin: 0; padding: 0 4px; background: #fff; color: var(--muted); pointer-events: none; transition: .15s; font-size: 12px; z-index: 1; }
    .field.floating>input:focus+label, .field.floating>input:not(:placeholder-shown)+label, .field.floating>textarea:focus+label, .field.floating>textarea:not(:placeholder-shown)+label { top: -7px; color: var(--primary); font-size: 10px; font-weight: 800; }
    .field.floating>select+label { top: -7px; color: var(--primary); font-size: 10px; font-weight: 800; }
    .field.floating>input, .field.floating>select, .field.floating>textarea { padding-top: 13px; }

    /* Modals & Toast Notifications */
    .modal-wrap { position: fixed; inset: 0; z-index: 100; background: rgba(10,17,30,.55); display: grid; place-items: center; padding: 16px; }
    .modal { width: min(720px,100%); max-height: min(90vh,800px); overflow: auto; background: #fff; border-radius: 22px; box-shadow: 0 25px 80px rgba(0,0,0,.25); }
    .modal-head { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--border); padding: 17px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .modal-head h2 { margin: 0; font-size: 19px; }
    .close { border: 0; background: #edf1f7; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; }
    .modal-body { padding: 20px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 9px; padding: 15px 20px; border-top: 1px solid var(--border); }
    .toast-box { position: fixed; right: 16px; bottom: 16px; z-index: 200; display: grid; gap: 10px; width: min(370px, calc(100% - 32px)); }
    .toast { background: #fff; border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 15px; padding: 13px 15px; animation: in .2s ease; }
    .toast b { display: block; }
    .toast span { font-size: 13px; color: var(--muted); }
    @keyframes in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

    /* Sidebar Navigation */
    .menu-btn { display: block; border: 1px solid var(--border); background: #fff; border-radius: 12px; width: 44px; height: 40px; font-size: 22px; box-shadow: 0 4px 14px rgba(28,39,65,.08); }
    .sidebar { position: fixed; top: 0; right: 0; z-index: 90; width: 290px; max-width: calc(100vw - 24px); height: 100vh; background: #fff; border-left: 1px solid var(--border); box-shadow: -15px 0 45px rgba(20,30,50,.14); padding: 18px; transform: translateX(105%); transition: transform .22s ease; overflow-y: auto; }
    .sidebar.open { transform: translateX(0); }
    .sidebar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; font-size: 14px; }
    .close-side { border: 0; background: #edf1f7; border-radius: 10px; width: 38px; height: 38px; font-size: 22px; }
    .side-section { font-size: 10px; font-weight: 800; letter-spacing: .12em; color: var(--muted); margin: 17px 4px 7px; }
    .side-btn { width: 100%; display: flex; align-items: center; gap: 9px; border: 1px solid transparent; background: #f5f7fa; color: var(--text); border-radius: 12px; padding: 12px 13px; margin: 6px 0; text-align: left; font-weight: 700; min-height: 44px; }
    .side-btn:hover { background: #edf1f7; transform: translateX(-2px); }
    .side-btn.active { background: linear-gradient(135deg, var(--primary), var(--primary2)); color: #fff; }
    .primary-side { background: linear-gradient(135deg, var(--primary), var(--primary2)); color: #fff; }
    .danger-side { color: var(--danger); background: #fff0f0; }
    .badge { margin-left: auto; min-width: 23px; height: 23px; padding: 2px 6px; border-radius: 999px; background: #fff; color: var(--primary); display: grid; place-items: center; font-size: 11px; }
    .sidebar-overlay { position: fixed; inset: 0; z-index: 80; background: rgba(8,15,28,.42); opacity: 0; visibility: hidden; transition: .2s; }
    .sidebar-overlay.show { opacity: 1; visibility: visible; }
    body.sidebar-open { overflow: auto; }

    /* Student Document - Birth Certificate Style (School Record) */
    .birth-document{background:#fffdf7;border:1px solid #b9a77b;border-radius:4px;padding:28px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.12);font-family:Georgia,"Times New Roman",serif;color:#242018;}
    .birth-document:before{content:"";position:absolute;inset:10px;border:4px double #9b7b2f;pointer-events:none;}
    .birth-document:after{content:"SCHOOL RECORD";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-25deg);font:900 48px Arial,sans-serif;letter-spacing:5px;color:#9b7b2f;opacity:.055;white-space:nowrap;pointer-events:none;}
    .birth-inner{position:relative;z-index:1;}
    .birth-head{text-align:center;padding:5px 30px 14px;}
    .birth-arabic{font-size:19px;font-weight:700;line-height:1.35;}
    .birth-school{font-size:18px;font-weight:900;text-transform:uppercase;margin-top:3px;}
    .birth-address{font:10px Arial,sans-serif;color:#555;margin-top:5px;}
    .birth-title{text-align:center;margin:15px 0 4px;font-size:23px;font-weight:900;letter-spacing:1px;text-transform:uppercase;}
    .birth-subtitle{text-align:center;font:10px Arial,sans-serif;color:#6a6252;letter-spacing:.8px;margin-bottom:18px;}
    .birth-rule{height:1px;background:#9b7b2f;margin:0 35px 15px;}
    .birth-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 25px;margin:0 30px;}
    .birth-row{border-bottom:1px dotted #9c9484;padding:7px 2px;min-width:0;}
    .birth-row.full{grid-column:1/-1;}
    .birth-label{display:block;font:700 8px Arial,sans-serif;text-transform:uppercase;color:#6f6758;letter-spacing:1px;margin-bottom:3px;}
    .birth-value{display:block;font-size:14px;font-weight:700;word-break:break-word;}
    .birth-section{grid-column:1/-1;margin-top:7px;padding:7px 0 3px;text-align:center;font:900 10px Arial,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:#806a31;}
    .birth-note{margin:18px 30px 0;font:9px/1.5 Arial,sans-serif;color:#6b665d;text-align:center;}
    .birth-sign{display:grid;grid-template-columns:1fr 1fr;gap:35px;margin:25px 35px 5px;text-align:center;}
    .birth-sign-line{border-top:1px solid #555;padding-top:5px;font:700 8px Arial,sans-serif;text-transform:uppercase;}
    .birth-footer{text-align:center;font:8px Arial,sans-serif;color:#777;margin-top:10px;}
    @media(max-width:620px){.birth-document{padding:18px}.birth-grid{margin:0 15px}.birth-head{padding-left:15px;padding-right:15px}.birth-school{font-size:14px}.birth-sign{margin-left:15px;margin-right:15px}.birth-note{margin-left:15px;margin-right:15px}}
    @media print{.birth-document{box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}}


    /* Print & Card Styling */
    .id-page { background: #e9edf4; padding: 16px; overflow: auto; }
    .a4 { width: 210mm; min-height: 297mm; margin: auto; background: #fff; padding: 10mm; display: grid; grid-template-columns: 86mm 86mm; grid-auto-rows: 54mm; gap: 5mm 8mm; align-content: start; justify-content: center; }
    .id-card { width: 86mm; height: 54mm; border: 1px solid #ccd3df; border-radius: 2mm; overflow: hidden; position: relative; background: #fff; box-sizing: border-box; }
    .id-front, .id-back {
      width: 86mm;
      height: 54mm;
      padding: 0;
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }
    .id-front { background-image: url("id-front-bg.png"); }
    .print-id-bg {
      position: absolute;
      inset: 0;
      width: 86mm;
      height: 54mm;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }
    .id-card > *:not(.print-id-bg) {
      position: relative;
      z-index: 1;
    }


    .id-back { background-image: url("id-back-bg.png"); }

    /* ID depan: susunan meniru contoh — header penuh di atas,
       kemudian foto di kiri dan maklumat pelajar di kanan. */
    .id-front-header {
      position: absolute;
      top: 2.1mm;
      left: 7mm;
      right: 1mm;
      text-align: center;
      font-weight: 900;
      color: #111;
      line-height: 1.08;
      z-index: 2;
    }
    .id-front-header .arabic {
      display: block;
      direction: rtl;
      font-size: 17px;
      margin-bottom: .5mm;
    }
    .id-front-header .school {
      display: block;
      font-size: 9px;
      white-space: nowrap;
    }
    .id-front-header .reg,
    .id-front-header .place,
    .id-front-header .address {
      display: block;
      font-size: 7.2px;
      white-space: nowrap;
    }

    .id-front-body {
      position: absolute;
      top: 4mm;
      left: 7mm;
      right: 7mm;
      display: grid;
      grid-template-columns: 22mm 1fr;
      gap: 4mm;
      align-items: start;
      z-index: 2;
    }
    .id-photo {
      width: 23mm;
      height: 26mm;
      object-fit: cover;
      border-radius: 1.5mm;
      background: #edf1f7;
    }
    .id-student-info {
      min-width: 0;
      padding-top: 1mm;
      color: #111;
    }
    .id-field {
      margin-bottom: 1.25mm;
      line-height: 1.02;
    }
    .id-field .label {
      display: block;
      font-size: 6.8px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: .45mm;
    }
    .id-field .value {
      display: block;
      font-size: 9.2px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }
    .id-field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3mm;
    }

    /* ID belakang: tajuk di atas kiri, maklumat utama di tengah seperti contoh. */
    .id-back-content {
      position: absolute;
      top: 3.5mm;
      left: 1mm;
      right: 7mm;
      color: #111;
      z-index: 2;
    }
    .id-back-title {
      font-size: 7.3px;
      font-weight: 900;
      line-height: 1.1;
      text-align: center;
      margin-bottom: 5.5mm;
    }
    .id-back-text {
      text-align: center;
      font-size: 7px;
      font-weight: 700;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .id-back-text p {
      margin: 0 0 1.5mm;
    }
    .print-only { display: none; }

    /* Media Queries */
    @media(max-width:900px) { .grid, .student-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media(max-width:650px) { 
      .topbar { align-items: flex-start; flex-direction: row; } 
      .page-head { align-items: flex-start; flex-direction: column; } 
      .grid, .student-grid, .form-grid { grid-template-columns: 1fr; } 
      .field.full { grid-column: auto; } 
      .modal-wrap { padding: 8px; } 
      .modal { max-height: 94vh; } 
      .id-page { padding: 8px; } 
      .a4 { margin: 0; transform: none; } 
    }
    @media print { 
      .id-front, .id-back { background-image: none !important; }
      .print-id-bg { display: block !important; visibility: visible !important; }
      body { background: #fff; } 
      .no-print { display: none !important; } 
      .print-only { display: block; } 
      .id-page { padding: 0; background: #fff; } 
      .a4 { box-shadow: none; margin: 0; padding: 10mm; page-break-after: always; } 
      .id-card { break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; } 
      .id-front, .id-back { -webkit-print-color-adjust: exact; print-color-adjust: exact; } 
      @page { size: A4 portrait; margin: 0; } 
    }
  
/* Student Detail - School Certificate */
.student-certificate{
  background:#fff;
  border:1px solid #c9c9c9;

  position:relative;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(0,0,0,.08);

  inset:8px;

}
.student-certificate .cert-inner{position:relative;z-index:1}
.student-certificate .cert-head{text-align:center;padding:8px 45px 14px}
.student-certificate .cert-arabic{font-size:17px;font-weight:700;line-height:1.35}

.student-certificate .cert-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.student-certificate .cert-field{border-bottom:1px dotted #aaa;padding:7px 0;text-align:center;min-width:0}
.student-certificate .cert-label{display:block;font:700 9px Arial,sans-serif;text-transform:uppercase;color:#666;letter-spacing:1px}
.student-certificate .cert-value{display:block;font-size:16px;font-weight:700;word-break:break-word;margin-top:4px}
.student-certificate .cert-field.full{grid-column:1/-1}.student-certificate .cert-field.full .cert-value{font-family:'SkyScript','Segoe Script','Brush Script MT',cursive;font-size:42px;font-weight:700;letter-spacing:.5px;text-transform:none}.student-certificate .certificate-achievement-fields .cert-field:nth-child(1){grid-column:1;order:1}.student-certificate .certificate-achievement-fields .achievement-field{grid-column:2;order:2}.student-certificate .certificate-achievement-fields .cert-field:nth-child(2){grid-column:1/-1;order:3}.student-certificate .cert-field.achievement-field .cert-value{font-family:Arial,sans-serif;font-size:16px;font-weight:700;letter-spacing:normal;text-transform:none;display:block;word-break:break-word;margin-top:4px}

.student-certificate .cert-note{
  margin:18px 30px 0;
  font:10px/1.5 Arial,sans-serif;
  color:#666;
  text-align:left;
}
@media(max-width:600px){
  .student-certificate .cert-note{margin:16px 18px 0;font-size:9px;line-height:1.45}

.student-certificate .cert-sign{display:grid;grid-template-columns:1fr 1fr;gap:35px;margin:24px 30px 4px;text-align:center}

.student-certificate .cert-head{padding-left:20px;padding-right:20px}
  .student-certificate .cert-rule{margin-left:20px;margin-right:20px}

}

    async function uploadPhoto(dataUrl,studentNo){
      if(!dataUrl || !dataUrl.startsWith("data:image/")) return "";
      const c=getSB(), m=dataUrl.match(/^data:(image\/[^;]+);base64,(.+)$/); if(!m) return "";
      const bin=atob(m[2]), bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      const mime=m[1], ext=mime.split("/")[1].replace("jpeg","jpg");
      const path=`${studentNo}-${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const {error}=await c.storage.from(PHOTO_BUCKET).upload(path,new Blob([bytes],{type:mime}),{contentType:mime,upsert:false});
      if(error) throw error; return c.storage.from(PHOTO_BUCKET).getPublicUrl(path).data.publicUrl;
    }

    function photoPicked(e) {
      const f = e.target.files?.[0];
      if(!f) return;
      if(!f.type || !f.type.startsWith("image/")) {
        toast("warning", "Invalid photo", "Please choose an image file.");
        return;
      }
      const r = new FileReader();
      r.onload = () => {
        const img = new Image();
        img.onload = () => {
          try {
            const max = 600;
            const scale = Math.min(1, max / Math.max(img.naturalWidth||img.width, img.naturalHeight||img.height));
            const w = Math.max(1, Math.round((img.naturalWidth||img.width) * scale));
            const h = Math.max(1, Math.round((img.naturalHeight||img.height) * scale));
            const c = document.createElement("canvas");
            c.width = w; c.height = h;
            c.getContext("2d").drawImage(img, 0, 0, w, h);
            photoData = c.toDataURL("image/jpeg", 0.68);
            const previewId = e.target.id==="editGallery"||e.target.id==="editCamera" ? "editPhotoPreview" : "photoPreview";
            const preview = $(previewId);
            if(preview) { preview.src = photoData; preview.classList.remove("hidden"); }
          } catch(err) {
            console.error("PHOTO COMPRESS ERROR:", err);
            photoData = r.result;
            const previewId = e.target.id==="editGallery"||e.target.id==="editCamera" ? "editPhotoPreview" : "photoPreview";
            const preview = $(previewId);
            if(preview) { preview.src = photoData; preview.classList.remove("hidden"); }
          }
        };
        img.onerror = () => toast("error", "Photo error", "The selected image could not be processed.");
        img.src = r.result;
      };
      r.onerror = () => toast("error", "Photo error", "The selected image could not be read.");
      r.readAsDataURL(f);
    }

    async function submitStudent(e){
      if(e)e.preventDefault();
      const btn=$("submitBtn"), form=$("studentForm");
      if(!btn||btn.disabled)return;
      try{
        // Let the browser validate only the fields explicitly marked required.
        // This prevents optional fields from incorrectly triggering "Incomplete form".
        if(form && !form.checkValidity()){
          form.reportValidity();
          return;
        }

        const fullname=$("fullname")?.value.trim()||"";
        const dob=$("dob")?.value||"";
        const contact=$("contact")?.value.trim()||"";
        const grade=$("grade")?.value||"";
        const address=$("address")?.value.trim()||"";
        const sex=$("sex")?.value||"";

        // Safety check with an exact list, so the user knows what is missing.
        const missing=[];
        if(!fullname) missing.push("Full Name");
        if(!sex) missing.push("Sex");
        if(!dob) missing.push("Date of Birth");
        if(!contact) missing.push("Student Contact Number");
        if(!grade) missing.push("Grade / Class");
        if(!address) missing.push("Complete Residential Address");
        if(missing.length){
          toast("warning","Incomplete form","Please complete: "+missing.join(", ")+".");
          return;
        }

        btn.disabled=true; btn.textContent="Saving..."; await loadData();
        if(students.some(s=>norm(s.fullname)===norm(fullname))||pending.some(s=>norm(s.fullname)===norm(fullname))){
          toast("warning","Duplicate student","This student name is already registered or awaiting review.");
          return;
        }

        const studentNo=nextNo(), uid="P-"+Date.now()+"-"+Math.random().toString(36).slice(2,10), photo=await uploadPhoto(photoData,studentNo);

        const record={
          id:uid, student_no:studentNo, fullname, dob, contact, grade, address,
          sex:$("sex").value, birthplace:$("birthplace").value.trim(), nationality:$("nationality").value.trim(),
          school_year:$("schoolyear").value.trim(), barangay:$("barangay").value.trim(),
          city_municipality:$("citymunicipality").value.trim(),
          father_name:$("fathername").value.trim(), father_contact:$("fathercontact").value.trim(),
          mother_name:$("mothername").value.trim(), mother_contact:$("mothercontact").value.trim(),
          guardian_name:$("guardianname").value.trim(), guardian_contact:$("guardiancontact").value.trim(),
          guardian_relationship:$("relationship").value.trim(), emergency_contact:$("emergencycontact").value.trim(),
          previous_school:$("previousschool").value.trim(), last_grade:$("lastgrade").value.trim(),
          enrollment_type:$("enrollmenttype").value, admission_date:$("admissiondate").value,
          additional_notes:$("additionalnotes").value.trim(),
          achievement:"",
          enrollment:isAdmin?($("enrollment")?.value||""):"",
          balance:isAdmin?($("balance")?.value||""):"",
          scholar:isAdmin?($("scholar")?.value||"No"):"No",
          paid:isAdmin?($("paid")?.value||"No"):"No",
          photo,status:"pending"
        };

        const {error}=await getSB().from("student_pending").insert(record);
        if(error)throw error;
        await loadData(); $("studentForm").reset(); photoData="";
        const pr=$("photoPreview"); if(pr){pr.removeAttribute("src");pr.classList.add("hidden");}
        toast("success","Student submitted","Student "+studentNo+" saved and awaiting Admin Review.");
      }catch(err){
        console.error(err);toast("error","Submit failed",err.message||"Could not save to Supabase.");
      }finally{btn.disabled=false;btn.textContent=isAdmin?"Save Student":"Submit Student";}
    }

          city_municipality:$("eCitymunicipality").value.trim(),
          father_name:$("eFathername").value.trim(), father_contact:$("eFathercontact").value.trim(),

          guardian_name:$("eGuardianname").value.trim(), guardian_contact:$("eGuardiancontact").value.trim(),
          guardian_relationship:$("eRelationship").value.trim(), emergency_contact:$("eEmergencycontact").value.trim(),
          previous_school:$("ePreviousschool").value.trim(), last_grade:$("eLastgrade").value.trim(),

          additional_notes:$("eAdditionalnotes").value.trim(),

        };

    async function approve(id){try{await loadData();const fresh=pending.find(x=>x.id===id);if(!fresh){toast("warning","Not found","Submission no longer available.");return;}if(students.some(s=>norm(s.fullname)===norm(fresh.fullname))){toast("warning","Duplicate student","Approval blocked: Name already exists.");return;}
      const student={...fresh,status:"approved"}; delete student.pending_id; const {error:ie}=await getSB().from("students").insert(student); if(ie)throw ie;
      const {error:de}=await getSB().from("student_pending").delete().eq("id",id); if(de){await getSB().from("students").delete().eq("id",fresh.id);throw de;}
      await loadData();render();toast("success","Approved","Student moved to Student Records.");
    }catch(err){console.error("APPROVE ERROR",err);toast("error","Approval failed",err.message||"Could not complete approval.");}}
    async function reject(id){try{const {error}=await getSB().from("student_pending").delete().eq("id",id);if(error)throw error;await loadData();render();toast("success","Rejected","Submission removed.");}catch(err){toast("error","Reject failed",err.message||"Could not remove submission.");}}

    function filterA4Preview() {
      const q = norm($("a4Search")?.value||"");
      const list = q ? students.filter(s => norm(s.fullname).includes(q)) : [];
      const resBox = $("a4SearchResults");
      
      if(!q) { resBox.innerHTML = ""; return; }
      if(!list.length) { resBox.innerHTML = "<small class='meta'>No matches found.</small>"; return; }

      resBox.innerHTML = list.map(s => {
        const isSel = a4Selected.find(x => x.id === s.id);
        return `<button class="btn ${isSel?'primary':''}" onclick="toggleA4('${s.id}')" style="font-size:12px; padding:6px 10px;">${isSel?'✓ ':''}${esc(s.fullname)}</button>`;
      }).join("");
    }

    function toggleA4(id) {
      const idx = a4Selected.findIndex(x => x.id === id);
      if(idx >= 0) {
        a4Selected.splice(idx, 1);
      } else {
        const s = students.find(x => x.id === id);
        if(s) a4Selected.push(s);
      }
      filterA4Preview();
      renderA4Preview();
    }

    function renderA4Preview() {
      const box = $("a4preview");
      const btn = $("btnPrintA4");
      if(!a4Selected.length) {
        box.innerHTML = `<div class="card empty">No students selected. Search and select names above.</div>`;
        if(btn) btn.disabled = true;
        return;
      }
      if(btn) btn.disabled = false;
      box.innerHTML = `<div class="a4">${a4Selected.map(s => idCard(s) + idCard(s, true)).join("")}</div>`;
    }

    function printA4() {
      const w = window.open("", "_blank");
      if(!w) { toast("error", "Print blocked", "Allow popups in your browser."); return; }
      const a = $("a4preview").innerHTML;
      w.document.write(`<html><head><base href="${document.baseURI}"><title>A4 Student ID Cards</title><style>${document.querySelector("style").textContent}
</style></head><body>${a}<script>window.onload=()=>window.print()<\/script></body></html>`);
      w.document.close();
    }

    function exportCSV() {
      if(!students.length) { toast("info", "No data", "No student data available to export."); return; }
      const rows = [["No","Student No","Full Name","Date of Birth","Contact No","Grade","Address","Enrollment Fee","Balance","Scholar","Paid Status"], ...students.map((s,i) => [i+1, s.student_no, s.fullname, s.dob, s.contact, s.grade, s.address, s.enrollment, s.balance, s.scholar, s.paid])];
      const csv = rows.map(r => r.map(v => `"${String(v??"").replace(/"/g, '""')}"`).join(",")).join("\n");
      download("students.csv", "text/csv;charset=utf-8", csv);
      toast("success", "CSV exported", "File created locally.");
    }

    function exportExcel() {
      if(!students.length) { toast("info", "No data", "No student data available to export."); return; }
      const rows = students.map((s,i) => ({No:i+1, "Student No":s.student_no, "Full Name":s.fullname, "Date of Birth":s.dob, "Contact No":s.contact, Grade:s.grade, Address:s.address, "Enrollment Fee":s.enrollment, Balance:s.balance, Scholar:s.scholar, "Paid Status":s.paid}));
      if(window.XLSX) {
        const wb = XLSX.utils.book_new(), ws = XLSX.utils.json_to_sheet(rows);
        XLSX.utils.book_append_sheet(wb, ws, "Students");
        XLSX.writeFile(wb, "students.xlsx");
      } else download("students.xls", "application/vnd.ms-excel", rows.map(Object.values).join("\n"));
      toast("success", "Excel exported", "File created locally.");
    }

    function download(name, type, data) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([data], {type}));
      a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    function showFatalError(err){
      console.error("APP STARTUP ERROR", err);
      const msg = err && err.message ? err.message : String(err || "Unknown error");
      const root = document.getElementById("app");
      if(root){
        root.innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7fb;font-family:Arial,sans-serif"><div style="width:min(620px,100%);background:#fff;border:1px solid #e3e8f0;border-radius:18px;padding:24px;box-shadow:0 12px 35px rgba(28,39,65,.10)"><h2 style="margin:0 0 8px">Student Data Management System</h2><p style="margin:0 0 12px;color:#687386">The application could not start correctly.</p><pre style="white-space:pre-wrap;background:#f7f8fa;padding:12px;border-radius:10px;font-size:12px;overflow:auto">${esc(msg)}</pre><button onclick="location.reload()" style="border:0;border-radius:12px;padding:11px 15px;background:#315efb;color:#fff;font-weight:700">Reload</button></div></div>`;
      }
    }

    function bootApp(){
      try{
        isAdmin = adminSessionActive();
        if(isAdmin && tab === "entry") tab = "data";
        render();
      }catch(err){ showFatalError(err); }
    }
    window.addEventListener("error", e => {
      if(e && e.error) showFatalError(e.error);
    });
    window.addEventListener("unhandledrejection", e => {
      if(e && e.reason) showFatalError(e.reason);
    });
    if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", bootApp, {once:true});
    else bootApp();
  </script>
</body>
</html>
