<style>
/* ===== FULL MODERN DASHBOARD EXTENSIONS ===== */
.dashboard-extra{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-top:16px}
.dashboard-panel{background:var(--card,#fff);border:1px solid rgba(100,116,139,.14);border-radius:18px;padding:18px;box-shadow:0 8px 28px rgba(15,23,42,.06)}
.dashboard-panel h3{margin:0 0 12px;font-size:16px}
.dash-span-8{grid-column:span 8}.dash-span-6{grid-column:span 6}.dash-span-4{grid-column:span 4}.dash-span-12{grid-column:span 12}
.dash-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.dash-search-wrap{position:relative;flex:1;min-width:220px}
.dash-search{flex:1;min-width:220px;padding:11px 14px;border:1px solid #dbe2ea;border-radius:12px;background:#fff;outline:none}
.dash-search:focus{border-color:#7c8cff;box-shadow:0 0 0 3px rgba(124,140,255,.12)}
.dash-btn{border:0;border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:700;background:#eef2ff;color:#374151}
.dash-btn:hover{filter:brightness(.97)}
.dash-btn.primary{background:#4f46e5;color:#fff}.dash-btn.success{background:#e8f8ef;color:#137333}.dash-btn.warn{background:#fff5db;color:#8a5b00}
.dash-mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dash-mini{padding:13px;border-radius:13px;background:#f8fafc;border:1px solid #edf1f5}
.dash-mini strong{display:block;font-size:21px;margin-top:4px}.dash-label{font-size:12px;color:#64748b}
.dash-bars{display:flex;align-items:flex-end;gap:10px;height:175px;padding:12px 2px 4px}
.dash-bar-col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.dash-bar{width:min(34px,70%);min-height:4px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#6366f1,#818cf8)}
.dash-bar-col small{font-size:10px;color:#64748b;white-space:nowrap}.dash-bar-col b{font-size:11px}
.dash-progress{height:9px;border-radius:20px;background:#edf2f7;overflow:hidden;margin:7px 0 12px}.dash-progress>span{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,#4f46e5,#818cf8)}
.dash-list{display:flex;flex-direction:column;gap:9px;max-height:285px;overflow:auto}
.dash-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;border:1px solid #edf1f5;border-radius:12px;background:#fff}
.dash-item-main{min-width:0}.dash-item-main strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dash-item-main small{color:#64748b}
.dash-badge{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#eef2ff;color:#4338ca;white-space:nowrap}
.dash-badge.orange{background:#fff4dd;color:#9a6200}
.dash-notice{display:flex;gap:11px;align-items:flex-start;padding:11px;border-radius:12px;background:#f8fafc;margin-bottom:9px}
.dash-notice-icon{font-size:20px}.dash-notice p{margin:2px 0 0;color:#64748b;font-size:12px}
.dash-calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dash-calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dash-calendar-grid div{text-align:center;padding:7px 2px;font-size:11px}
.dash-cal-day{border:1px solid #edf1f5;border-radius:9px;min-height:34px;background:#fff}.dash-cal-day.today{background:#eef2ff;border-color:#a5b4fc;color:#3730a3;font-weight:800}.dash-cal-muted{color:#cbd5e1}
.dash-connection{display:flex;align-items:center;gap:8px;font-weight:700}.dash-dot{width:10px;height:10px;border-radius:50%;background:#94a3b8}.dash-dot.online{background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.12)}
.dash-school-year{font-size:28px;font-weight:900;margin:4px 0}.dash-empty{padding:22px;text-align:center;color:#64748b}
@media(max-width:900px){.dash-span-8,.dash-span-6,.dash-span-4{grid-column:span 12}}
@media(max-width:600px){.dashboard-extra{gap:12px}.dashboard-panel{padding:14px;border-radius:15px}.dash-search{min-width:100%;order:1}.dash-btn{flex:1}.dash-mini-grid{grid-template-columns:1fr 1fr}}
</style>

<style id="dark-light-mode-style">
html[data-theme="dark"]{--bg:#0b1220;--card:#111827;--text:#e5e7eb;--muted:#9ca3af;--border:#263244;--shadow:0 12px 35px rgba(0,0,0,.32)}
html[data-theme="dark"] body{background:var(--bg);color:var(--text)}
html[data-theme="dark"] .topbar,html[data-theme="dark"] .sidebar,html[data-theme="dark"] .modal,html[data-theme="dark"] .modal-head,html[data-theme="dark"] .card,html[data-theme="dark"] .dashboard-panel,html[data-theme="dark"] .stat-card,html[data-theme="dark"] .dashboard-stat,html[data-theme="dark"] .search,html[data-theme="dark"] .field input,html[data-theme="dark"] .field select,html[data-theme="dark"] .field textarea,html[data-theme="dark"] .toast{background:var(--card);color:var(--text);border-color:var(--border)}
html[data-theme="dark"] .topbar{background:rgba(17,24,39,.94)}
html[data-theme="dark"] .nav button,html[data-theme="dark"] .btn:not(.primary):not(.danger),html[data-theme="dark"] .dash-btn,html[data-theme="dark"] .menu-btn,html[data-theme="dark"] .close,html[data-theme="dark"] .close-side{background:#1f2937;color:var(--text)}

html[data-theme="dark"] .side-btn:hover{background:#263244}
html[data-theme="dark"] .dash-mini,html[data-theme="dark"] .quick-action,html[data-theme="dark"] .dashboard-mini-card,html[data-theme="dark"] .recent-row,html[data-theme="dark"] .dash-item,html[data-theme="dark"] .dash-notice{background:#172033;border-color:#263244;color:var(--text)}
html[data-theme="dark"] .quick-action:hover{background:#1f2937}
html[data-theme="dark"] .student-photo,html[data-theme="dark"] .teacher-photo,html[data-theme="dark"] .photo-preview{background:#1f2937}

html[data-theme="dark"] .student-certificate,html[data-theme="dark"] .birth-document,html[data-theme="dark"] .teacher-doc{background:#fff;color:#242018}

</style>

  <!-- ========================================== -->

  <!-- 2. GAYA CSS                                -->
  <!-- ========================================== -->
  <style>


@import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');
    :root {
      --bg: #f4f7fb;
      --card: #fff;
      --text: #172033;
      --muted: #687386;
      --primary: #315efb;
      --primary2: #7048e8;
      --danger: #d63939;
      --border: #e3e8f0;
      --shadow: 0 12px 35px rgba(28,39,65,.10);
      --radius: 18px;
    }
    
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .app { min-height: 100vh; }
    
    /* Layout Header & Navigation */
    .topbar { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.94); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { font-weight: 800; font-size: 18px; }
    .brand small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .nav { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav button, .btn { border: 0; border-radius: 12px; padding: 10px 14px; font-weight: 700; background: #edf1f7; color: var(--text); }
    .nav button.active, .btn.primary { color: #fff; background: linear-gradient(135deg, var(--primary), var(--primary2)); }
    .btn.danger { background: #fff0f0; color: var(--danger); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    
    /* Main Content Area */
    main { width: min(1280px, calc(100% - 28px)); margin: 24px auto 60px; }
    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 18px; }
    .page-head h1 { margin: 0; font-size: 26px; }
    .page-head p { margin: 5px 0 0; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
    .stat strong { font-size: 28px; display: block; }
    .stat span { color: var(--muted); font-size: 13px; }
    
    /* Toolbar & Student Grid */
    .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
    .certificate-toolbar .search { flex:1 1 260px; min-width:0; }
    .certificate-toolbar-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .certificate-toolbar-actions .btn { white-space:nowrap; }
    @media(max-width:620px){
      .certificate-toolbar { gap:8px; }
      .certificate-toolbar .search { flex:1 1 100%; width:100%; }
      .certificate-toolbar-actions { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:7px; }
      .certificate-toolbar-actions .btn:last-child { grid-column:1/-1; }
    }
    .search { flex: 1; min-width: 220px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 13px; background: #fff; outline: none; }
    .search:focus, input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(49,94,251,.10); }
    .student-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; align-items:start; }
    .student-card { overflow:hidden; padding:12px; cursor:pointer; transition:.2s; display:grid; grid-template-columns:auto 1fr; grid-template-rows:auto 1fr; column-gap:10px; row-gap:8px; align-items:start; }
    .student-card:hover { transform:translateY(-2px); }
    .student-card .certificate-select { grid-column:1/-1; display:flex; align-items:center; gap:6px; margin:0; min-height:28px; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap; }
    .student-card .certificate-select input { width:16px; height:16px; margin:0; flex:0 0 auto; }
    .student-photo { width:56px; height:68px; min-width:56px; object-fit:cover; border-radius:10px; background:#eef2f7; }
    .student-body { padding:0; min-width:0; width:100%; }
    .student-body h3 { margin:0 0 5px; overflow-wrap:anywhere; line-height:1.15; font-size:15px; }
    .meta { color:var(--muted); font-size:12px; line-height:1.45; overflow-wrap:anywhere; }
    .actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; margin-top:10px; width:100%; }
    .actions .btn { width:100%; min-width:0; padding:8px 6px; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .certificate-selected { border-color:var(--primary); box-shadow:0 0 0 2px rgba(49,94,251,.10),var(--shadow); }

    @media(max-width:980px){
      .student-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media(max-width:620px){
      .student-grid { grid-template-columns:1fr; gap:12px; }
      .student-card { padding:13px; grid-template-columns:auto minmax(0,1fr); }
      .student-photo { width:60px; height:72px; min-width:60px; }
      .student-body h3 { font-size:16px; }
      .meta { font-size:12px; line-height:1.5; }
      .actions { gap:7px; }
      .actions .btn { padding:9px 7px; font-size:12px; }
    }

    /* Teacher Management */
    .teacher-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
    .teacher-card { display:flex; gap:13px; align-items:flex-start; }
    .teacher-photo { width:72px; height:88px; min-width:72px; object-fit:cover; border-radius:12px; background:#eef2f7; border:1px solid var(--border); }
    .teacher-body { min-width:0; flex:1; }
    .teacher-body h3 { margin:0 0 5px; overflow-wrap:anywhere; }
    /* Teacher ID: vertical 70 x 100 mm — school header top, photo center, teacher information below */
    .teacher-id-card { width:70mm; max-width:100%; aspect-ratio:70 / 100; height:auto; margin:0 auto; position:relative; overflow:hidden; border-radius:4mm; background-color:#fff; background-image:url("teacher-id-background.png"); background-repeat:no-repeat; background-position:center; background-size:100% 100%; border:1px solid #cbd5e1; box-shadow:0 10px 28px rgba(20,30,50,.14); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    /* Fixed print-safe positions prevent the teacher photo and information from overlapping. */
    .teacher-id-card .teacher-id-inner { position:absolute; inset:0; padding:0 3.5mm; box-sizing:border-box; }
    .teacher-id-head { position:absolute; top:2mm; left:3.5mm; right:3.5mm; width:auto; text-align:center; font-weight:900; line-height:1; margin:0; }
    .teacher-id-logo { width:10mm; height:10mm; object-fit:contain; display:block; margin:0 auto .45mm; }
    .teacher-id-head .arabic { display:block; direction:rtl; font-size:12px; line-height:1.02; }
    .teacher-id-head .school { display:block; font-size:12px; margin-top:.45mm; line-height:1.02; }
    .teacher-id-head .sub { display:block; font-size:6.8px; margin-top:.55mm; line-height:1.05; }
    .teacher-id-photo { position:absolute; top:28mm; left:50%; transform:translateX(-50%); width:33mm; height:40mm; object-fit:cover; border-radius:2mm; border:1px solid #b8c0cc; background:#eef2f7; margin:0; display:block; }
    .teacher-id-info { position:absolute; top:68.5mm; left:3.5mm; right:3.5mm; width:auto; min-width:0; color:#111; text-align:center; }
    .teacher-id-name { font-size:18px; font-weight:900; text-transform:uppercase; overflow-wrap:anywhere; line-height:1.02; margin:0 0 1mm; }
    .teacher-id-row { display:grid; grid-template-columns:1fr 1fr; gap:2.5mm; margin-top:.9mm; text-align:left; align-items:start; }
    .teacher-id-row .full-field { grid-column:1 / -1; text-align:center; }
    .teacher-id-field { min-width:0; }
    .teacher-id-field .label { display:block; font-size:7.5px; font-weight:900; text-transform:uppercase; color:#687386; margin-bottom:.22mm; line-height:1; white-space:nowrap; }
    .teacher-id-field .value { display:block; font-size:11.5px; font-weight:900; line-height:1.03; overflow-wrap:anywhere; }
    .teacher-id-footer { position:absolute; left:3.5mm; right:3.5mm; bottom:.7mm; text-align:center; font-size:7px; font-weight:900; line-height:1; }
    .teacher-doc { background:#fffdf7; border:1px solid #b9a77b; padding:25px; position:relative; color:#242018; font-family:Georgia,"Times New Roman",serif; }
    .teacher-doc:before { content:""; position:absolute; inset:9px; border:4px double #9b7b2f; pointer-events:none; }
    .teacher-doc-inner { position:relative; z-index:1; }
    .teacher-doc-head { text-align:center; padding:4px 30px 14px; }
    .teacher-doc-head img { width:58px; height:58px; object-fit:contain; display:block; margin:0 auto 5px; }
    .teacher-doc-head .arabic { font-size:18px; font-weight:700; direction:rtl; }
    .teacher-doc-head .school { font-size:16px; font-weight:900; text-transform:uppercase; }
    .teacher-doc-title { text-align:center; font-size:22px; font-weight:900; margin:8px 0 15px; text-transform:uppercase; }
    .teacher-doc-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px 20px; }
    .teacher-doc-field { border-bottom:1px dotted #aaa; padding:6px 0; }
    .teacher-doc-field.full { grid-column:1/-1; }
    .teacher-doc-field .label { display:block; font:700 9px Arial,sans-serif; text-transform:uppercase; color:#666; }
    .teacher-doc-field .value { display:block; font-size:14px; font-weight:700; margin-top:3px; overflow-wrap:anywhere; }
    .teacher-photo-actions { display:flex; gap:8px; flex-wrap:wrap; padding-top:24px; }
    @media(max-width:900px){ .teacher-grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
    @media(max-width:650px){ .teacher-grid{grid-template-columns:1fr;} .teacher-id-card{max-width:100%;} .teacher-doc-grid{grid-template-columns:1fr;} .teacher-doc-field.full{grid-column:auto;} }
    @media print{ .teacher-id-card{box-shadow:none; break-inside:avoid; margin:0 auto;} .teacher-doc{box-shadow:none; min-height:277mm;} .teacher-doc-field{break-inside:avoid;} }
    .empty { text-align: center; padding: 45px 20px; color: var(--muted); }
    
    /* Forms & Photo Elements */
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; }
    .field input, .field select, .field textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 12px; background: #fff; outline: none; }
    .field.full { grid-column: 1/-1; }
    .field textarea { min-height: 90px; resize: vertical; }
    .photo-actions { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 24px; }
    .photo-preview { width: 120px; height: 120px; object-fit: cover; border-radius: 15px; border: 1px solid var(--border); background: #eef2f7; margin-top: 12px; display: block; }
    
    /* Floating Labels */
    .field.floating { position: relative; }
    .field.floating>label { position: absolute; left: 12px; top: 11px; margin: 0; padding: 0 4px; background: #fff; color: var(--muted); pointer-events: none; transition: .15s; font-size: 12px; z-index: 1; }
    .field.floating>input:focus+label, .field.floating>input:not(:placeholder-shown)+label, .field.floating>textarea:focus+label, .field.floating>textarea:not(:placeholder-shown)+label { top: -7px; color: var(--primary); font-size: 10px; font-weight: 800; }
    .field.floating>select+label { top: -7px; color: var(--primary); font-size: 10px; font-weight: 800; }
    .field.floating>input, .field.floating>select, .field.floating>textarea { padding-top: 13px; }

    /* Modals & Toast Notifications */
    .modal-wrap { position: fixed; inset: 0; z-index: 100; background: rgba(10,17,30,.55); display: grid; place-items: center; padding: 16px; }
    .modal { width: min(720px,100%); max-height: min(90vh,800px); overflow: auto; background: #fff; border-radius: 22px; box-shadow: 0 25px 80px rgba(0,0,0,.25); }
    .modal-head { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--border); padding: 17px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .modal-head h2 { margin: 0; font-size: 19px; }
    .close { border: 0; background: #edf1f7; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; }
    .modal-body { padding: 20px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 9px; padding: 15px 20px; border-top: 1px solid var(--border); }
    .toast-box { position: fixed; right: 16px; bottom: 16px; z-index: 200; display: grid; gap: 10px; width: min(370px, calc(100% - 32px)); }
    .toast { background: #fff; border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 15px; padding: 13px 15px; animation: in .2s ease; }
    .toast b { display: block; }
    .toast span { font-size: 13px; color: var(--muted); }
    @keyframes in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

    /* Sidebar Navigation */
    .menu-btn { display: block; border: 1px solid var(--border); background: #fff; border-radius: 12px; width: 44px; height: 40px; font-size: 22px; box-shadow: 0 4px 14px rgba(28,39,65,.08); }
    .sidebar { position: fixed; top: 0; right: 0; z-index: 90; width: 290px; max-width: calc(100vw - 24px); height: 100vh; background: #fff; border-left: 1px solid var(--border); box-shadow: -15px 0 45px rgba(20,30,50,.14); padding: 18px; transform: translateX(105%); transition: transform .22s ease; overflow-y: auto; }
    .sidebar.open { transform: translateX(0); }
    .sidebar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; font-size: 14px; }
    .close-side { border: 0; background: #edf1f7; border-radius: 10px; width: 38px; height: 38px; font-size: 22px; }
    .side-section { font-size: 10px; font-weight: 800; letter-spacing: .12em; color: var(--muted); margin: 17px 4px 7px; }
    .side-btn { width: 100%; display: flex; align-items: center; gap: 9px; border: 1px solid transparent; background: #f5f7fa; color: var(--text); border-radius: 12px; padding: 12px 13px; margin: 6px 0; text-align: left; font-weight: 700; min-height: 44px; }
    .side-btn:hover { background: #edf1f7; transform: translateX(-2px); }
    .side-btn.active { background: linear-gradient(135deg, var(--primary), var(--primary2)); color: #fff; }
    .primary-side { background: linear-gradient(135deg, var(--primary), var(--primary2)); color: #fff; }
    .danger-side { color: var(--danger); background: #fff0f0; }
    .badge { margin-left: auto; min-width: 23px; height: 23px; padding: 2px 6px; border-radius: 999px; background: #fff; color: var(--primary); display: grid; place-items: center; font-size: 11px; }
    .sidebar-overlay { position: fixed; inset: 0; z-index: 80; background: rgba(8,15,28,.42); opacity: 0; visibility: hidden; transition: .2s; }
    .sidebar-overlay.show { opacity: 1; visibility: visible; }
    body.sidebar-open { overflow: auto; }

    /* Student Document - Birth Certificate Style (School Record) */
    .birth-document{background:#fffdf7;border:1px solid #b9a77b;border-radius:4px;padding:28px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.12);font-family:Georgia,"Times New Roman",serif;color:#242018;}

    const THEME_KEY = "student_data_system_theme";
    function applyTheme(theme){
      const value = theme === "dark" ? "dark" : "light";

    async function uploadPhoto(dataUrl,studentNo){
      if(!dataUrl || !dataUrl.startsWith("data:image/")) return "";
      const c=getSB(), m=dataUrl.match(/^data:(image\/[^;]+);base64,(.+)$/); if(!m) return "";
      const bin=atob(m[2]), bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      const mime=m[1], ext=mime.split("/")[1].replace("jpeg","jpg");
      const path=`${studentNo}-${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const {error}=await c.storage.from(PHOTO_BUCKET).upload(path,new Blob([bytes],{type:mime}),{contentType:mime,upsert:false});
      if(error) throw error; return c.storage.from(PHOTO_BUCKET).getPublicUrl(path).data.publicUrl;
    }

    function photoPicked(e) {
      const f = e.target.files?.[0];
      if(!f) return;
      if(!f.type || !f.type.startsWith("image/")) {
        toast("warning", "Invalid photo", "Please choose an image file.");
        return;
      }
      const r = new FileReader();
      r.onload = () => {
        const img = new Image();
        img.onload = () => {
          try {
            const max = 600;
            const scale = Math.min(1, max / Math.max(img.naturalWidth||img.width, img.naturalHeight||img.height));
            const w = Math.max(1, Math.round((img.naturalWidth||img.width) * scale));
            const h = Math.max(1, Math.round((img.naturalHeight||img.height) * scale));
            const c = document.createElement("canvas");
            c.width = w; c.height = h;
            c.getContext("2d").drawImage(img, 0, 0, w, h);
            photoData = c.toDataURL("image/jpeg", 0.68);
            const previewId = e.target.id==="editGallery"||e.target.id==="editCamera" ? "editPhotoPreview" : "photoPreview";
            const preview = $(previewId);
            if(preview) { preview.src = photoData; preview.classList.remove("hidden"); }
          } catch(err) {
            console.error("PHOTO COMPRESS ERROR:", err);
            photoData = r.result;
            const previewId = e.target.id==="editGallery"||e.target.id==="editCamera" ? "editPhotoPreview" : "photoPreview";
            const preview = $(previewId);
            if(preview) { preview.src = photoData; preview.classList.remove("hidden"); }
          }
        };
        img.onerror = () => toast("error", "Photo error", "The selected image could not be processed.");
        img.src = r.result;
      };
      r.onerror = () => toast("error", "Photo error", "The selected image could not be read.");
      r.readAsDataURL(f);
    }

    async function submitStudent(e){
      if(e)e.preventDefault();
      const btn=$("submitBtn"), form=$("studentForm");
      if(!btn||btn.disabled)return;
      try{
        // Let the browser validate only the fields explicitly marked required.
        // This prevents optional fields from incorrectly triggering "Incomplete form".
        if(form && !form.checkValidity()){
          form.reportValidity();
          return;
        }

        const fullname=$("fullname")?.value.trim()||"";
        const dob=$("dob")?.value||"";
        const contact=$("contact")?.value.trim()||"";
        const grade=$("grade")?.value||"";
        const address=$("address")?.value.trim()||"";
        const sex=$("sex")?.value||"";

        // Safety check with an exact list, so the user knows what is missing.
        const missing=[];
        if(!fullname) missing.push("Full Name");
        if(!sex) missing.push("Sex");
        if(!dob) missing.push("Date of Birth");
        if(!contact) missing.push("Student Contact Number");
        if(!grade) missing.push("Grade / Class");
        if(!address) missing.push("Complete Residential Address");
        if(missing.length){
          toast("warning","Incomplete form","Please complete: "+missing.join(", ")+".");
          return;
        }

        btn.disabled=true; btn.textContent="Saving..."; await loadData();
        if(students.some(s=>norm(s.fullname)===norm(fullname))||pending.some(s=>norm(s.fullname)===norm(fullname))){
          toast("warning","Duplicate student","This student name is already registered or awaiting review.");
          return;
        }

        const studentNo=nextNo(), uid="P-"+Date.now()+"-"+Math.random().toString(36).slice(2,10), photo=await uploadPhoto(photoData,studentNo);

        const record={
          id:uid, student_no:studentNo, fullname, dob, contact, grade, address,
          sex:$("sex").value, birthplace:$("birthplace").value.trim(), nationality:$("nationality").value.trim(),
          school_year:$("schoolyear").value.trim(), barangay:$("barangay").value.trim(),
          city_municipality:$("citymunicipality").value.trim(),
          father_name:$("fathername").value.trim(), father_contact:$("fathercontact").value.trim(),
          mother_name:$("mothername").value.trim(), mother_contact:$("mothercontact").value.trim(),
          guardian_name:$("guardianname").value.trim(), guardian_contact:$("guardiancontact").value.trim(),
          guardian_relationship:$("relationship").value.trim(), emergency_contact:$("emergencycontact").value.trim(),
          previous_school:$("previousschool").value.trim(), last_grade:$("lastgrade").value.trim(),
          enrollment_type:$("enrollmenttype").value, admission_date:$("admissiondate").value,
          additional_notes:$("additionalnotes").value.trim(),
          achievement:"",
          enrollment:isAdmin?($("enrollment")?.value||""):"",
          balance:isAdmin?($("balance")?.value||""):"",
          scholar:isAdmin?($("scholar")?.value||"No"):"No",
          paid:isAdmin?($("paid")?.value||"No"):"No",
          photo,status:"pending"
        };

        const {error}=await getSB().from("student_pending").insert(record);
        if(error)throw error;
        await loadData(); $("studentForm").reset(); photoData="";
        const pr=$("photoPreview"); if(pr){pr.removeAttribute("src");pr.classList.add("hidden");}
        toast("success","Student submitted","Student "+studentNo+" saved and awaiting Admin Review.");
      }catch(err){
        console.error(err);toast("error","Submit failed",err.message||"Could not save to Supabase.");
      }finally{btn.disabled=false;btn.textContent=isAdmin?"Save Student":"Submit Student";}
    }


    function dashboardPage(){
      // Safe dashboard renderer: never allow a dashboard calculation error to blank the whole app.
      try{
        const safeEsc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
        const safeGet=(o,keys,f="")=>{
          if(!o||typeof o!=="object") return f;
          for(const k of keys){if(o[k]!==undefined&&o[k]!==null&&o[k]!=="")return o[k];}

          for(let d=1;d<=days;d++)h+=`<div class="dash-cal-day ${d===now.getDate()?"today":""}">${d}</div>`;

        $("main").innerHTML=`<div class="dashboard-page">

          <div class="field"><label>School Year</label><input id="eSchoolyear" value="${esc(s.school_year||"2026-2027")}"></div>
          <div class="field full"><label>Address</label><textarea id="eAddress" required>${esc(s.address)}</textarea></div>
          <div class="field"><label>Barangay / Zone</label><input id="eBarangay" value="${esc(s.barangay||"")}"></div>
          <div class="field"><label>City / Municipality</label><input id="eCitymunicipality" value="${esc(s.city_municipality||"")}"></div>
          <div class="field"><label>Father's Full Name</label><input id="eFathername" value="${esc(s.father_name||"")}"></div>
          <div class="field"><label>Father's Contact</label><input id="eFathercontact" value="${esc(s.father_contact||"")}"></div>
          <div class="field"><label>Mother's Full Name</label><input id="eMothername" value="${esc(s.mother_name||"")}"></div>
          <div class="field"><label>Mother's Contact</label><input id="eMothercontact" value="${esc(s.mother_contact||"")}"></div>
          <div class="field"><label>Guardian / Representative</label><input id="eGuardianname" value="${esc(s.guardian_name||"")}"></div>
          <div class="field"><label>Guardian Contact</label><input id="eGuardiancontact" value="${esc(s.guardian_contact||"")}"></div>
          <div class="field"><label>Relationship</label><input id="eRelationship" value="${esc(s.guardian_relationship||"")}"></div>
          <div class="field"><label>Emergency Contact</label><input id="eEmergencycontact" value="${esc(s.emergency_contact||"")}"></div>
          <div class="field"><label>Previous School</label><input id="ePreviousschool" value="${esc(s.previous_school||"")}"></div>
          <div class="field"><label>Last Grade Completed</label><input id="eLastgrade" value="${esc(s.last_grade||"")}"></div>
          <div class="field"><label>Enrollment Type</label><select id="eEnrollmenttype"><option value="">Select type</option><option ${s.enrollment_type==="New Student"?"selected":""}>New Student</option><option ${s.enrollment_type==="Returning Student"?"selected":""}>Returning Student</option><option ${s.enrollment_type==="Transferee"?"selected":""}>Transferee</option></select></div>
          <div class="field"><label>Date of Admission</label><input id="eAdmissiondate" type="date" value="${esc(s.admission_date||"")}"></div>
          <div class="field full"><label>Additional Notes</label><textarea id="eAdditionalnotes" rows="3">${esc(s.additional_notes||"")}</textarea></div>
          <div class="field"><label>Enrollment Fee</label><input id="eEnrollment" value="${esc(s.enrollment||"")}"></div>
          <div class="field"><label>Balance</label><input id="eBalance" value="${esc(s.balance||"")}"></div>
          <div class="field"><label>Scholar</label><select id="eScholar"><option ${s.scholar==="Yes"?"selected":""}>Yes</option><option ${s.scholar!=="Yes"?"selected":""}>No</option></select></div>
          <div class="field"><label>Paid Status</label><input id="ePaid" type="text" value="${esc(s.paid||"")}"></div>
        </div>
        <div style="margin-top:16px"><button class="btn primary" type="submit">Save Changes</button></div>
      </form>`);
    }

    async function updateStudent(e){
      e.preventDefault(); try{ const s=students.find(x=>x.id===editingId); if(!s)return;
        const achievement=$("eAchievement").value.trim();
        const updated={
          achievement, fullname:$("eName").value.trim(), sex:$("eSex").value, dob:$("eDob").value,
          birthplace:$("eBirthplace").value.trim(), nationality:$("eNationality").value.trim(),
          contact:$("eContact").value.trim(), grade:$("eGrade").value, school_year:$("eSchoolyear").value.trim(),
          address:$("eAddress").value.trim(), barangay:$("eBarangay").value.trim(),
          city_municipality:$("eCitymunicipality").value.trim(),
          father_name:$("eFathername").value.trim(), father_contact:$("eFathercontact").value.trim(),
          mother_name:$("eMothername").value.trim(), mother_contact:$("eMothercontact").value.trim(),
          guardian_name:$("eGuardianname").value.trim(), guardian_contact:$("eGuardiancontact").value.trim(),
          guardian_relationship:$("eRelationship").value.trim(), emergency_contact:$("eEmergencycontact").value.trim(),
          previous_school:$("ePreviousschool").value.trim(), last_grade:$("eLastgrade").value.trim(),
          enrollment_type:$("eEnrollmenttype").value, admission_date:$("eAdmissiondate").value,
          additional_notes:$("eAdditionalnotes").value.trim(),
          enrollment:$("eEnrollment").value,balance:$("eBalance").value,scholar:$("eScholar").value,paid:$("ePaid").value
        };
        if(photoData&&photoData.startsWith("data:image/"))updated.photo=await uploadPhoto(photoData,s.student_no);
        const {error}=await getSB().from("students").update(updated).eq("id",editingId); if(error)throw error; await loadData(); closeModal(); render(); toast("success","Updated","Student record updated.");
      }catch(err){console.error(err);toast("error","Update failed",err.message||"Could not update the student.");}
    }
    function deleteStudent(id){const s=students.find(x=>x.id===id);if(!s)return;openModal("Delete student?",`<p>Delete <b>${esc(s.fullname)}</b>?</p><p class="meta">This action is permanent.</p><div class="actions"><button class="btn" onclick="closeModal()">Keep Record</button><button class="btn danger" onclick="confirmDelete('${id}')">Delete Permanently</button></div>`);}
    async function confirmDelete(id){try{const {error}=await getSB().from("students").delete().eq("id",id);if(error)throw error;await loadData();closeModal();render();toast("success","Deleted","Student record deleted.");}catch(err){toast("error","Delete failed",err.message||"Could not delete the student.");}}
    async function reviewPage(){
      try{await loadData();}catch(err){toast("error","Database connection failed",err.message||"Could not load pending submissions.");}
      $("main").innerHTML=`<div class="page-head"><div><h1>Pending Review</h1><p>Approve or reject public submissions stored in Supabase.</p></div></div><div id="reviewList"></div>`;
      const arr=pending.filter(x=>x.status==="pending"); $("reviewList").innerHTML=arr.length?arr.map(s=>`<div class="card pending-card" style="margin-bottom:12px;display:flex;align-items:flex-start;gap:12px">${s.photo?`<img class="student-photo" src="${esc(s.photo)}" alt="Student photo">`:`<div class="student-photo" style="display:grid;place-items:center;color:#8a93a3;font-size:9px">No Photo</div>`}<div style="min-width:0;flex:1"><b>${esc(s.fullname)}</b><div class="meta">${esc(s.student_no)} • ${esc(s.grade)} • ${esc(s.contact)}</div><div class="actions"><button class="btn" onclick="pendingDetail('${s.id}')">Details</button><button class="btn primary" onclick="approve('${s.id}')">Approve</button><button class="btn danger" onclick="reject('${s.id}')">Reject</button></div></div></div>`).join(""):`<div class="card empty">No pending submissions.</div>`;
    }
    function viewFullImage(id){const s=[...students,...pending].find(x=>x.id===id);if(!s||!s.photo)return;openModal("Student Photo",`<div style="text-align:center"><img src="${esc(s.photo)}" style="max-width:100%;max-height:70vh;object-fit:contain;border-radius:14px"></div>`);}
    function pendingDetail(id){const s=pending.find(x=>x.id===id);if(!s)return;openModal("Pending Student Detail",`<img src="${esc(s.photo||"")}" style="width:100px;height:125px;object-fit:cover;border-radius:14px"><h2>${esc(s.fullname)}</h2><div class="meta">Student No: ${esc(s.student_no)}<br>Address: ${esc(s.address)}<br>DOB: ${esc(s.dob)}<br>Contact: ${esc(s.contact)}<br>Grade: ${esc(s.grade)}<br>Enrollment Fee: ${esc(s.enrollment||"")}<br>Balance: ${esc(s.balance||"")}<br>Scholar: ${esc(s.scholar||"No")}<br>Paid Status: ${esc(s.paid||"No")}</div>`);}
    async function approve(id){try{await loadData();const fresh=pending.find(x=>x.id===id);if(!fresh){toast("warning","Not found","Submission no longer available.");return;}if(students.some(s=>norm(s.fullname)===norm(fresh.fullname))){toast("warning","Duplicate student","Approval blocked: Name already exists.");return;}
      const usedNo=new Set(students.map(s=>norm(s.student_no)).filter(Boolean));
      let assignedNo=String(fresh.student_no||"").trim();
      if(!assignedNo||usedNo.has(norm(assignedNo))) assignedNo=nextNo();
      const student={...fresh,student_no:assignedNo,status:"approved"}; delete student.pending_id; const {error:ie}=await getSB().from("students").insert(student); if(ie)throw ie;
      const {error:de}=await getSB().from("student_pending").delete().eq("id",id); if(de){await getSB().from("students").delete().eq("id",fresh.id);throw de;}
      await loadData();render();toast("success","Approved","Student moved to Student Records.");
    }catch(err){console.error("APPROVE ERROR",err);toast("error","Approval failed",err.message||"Could not complete approval.");}}
    async function reject(id){try{const {error}=await getSB().from("student_pending").delete().eq("id",id);if(error)throw error;await loadData();render();toast("success","Rejected","Submission removed.");}catch(err){toast("error","Reject failed",err.message||"Could not remove submission.");}}

    function openLogin() {
      openModal("Admin Login", `<form onsubmit="login(event)"><div class="field floating"><input id="loginUser" placeholder=" " autocomplete="username" required><label>Username</label></div><div class="field floating" style="margin-top:12px"><input id="loginPass" placeholder=" " type="password" autocomplete="current-password" required><label>Password</label></div><button class="btn primary" style="width:100%;margin-top:15px">Login</button></form>`);
    }

    function login(e) {
      e.preventDefault();
      if($("loginUser").value === ADMIN_USER && $("loginPass").value === ADMIN_PASS) {
        isAdmin = true;
        tab = "dashboard";
        try { localStorage.setItem(ADMIN_SESSION_KEY, "1"); } catch(err) { console.warn("Could not persist admin session", err); }
        closeModal(); toggleSidebar(false); render();
        toast("success", "Welcome", "Administrator login successful.");
      } else {
        toast("error", "Login failed", "Invalid username or password.");
      }
    }

    function logout() {
      isAdmin = false;
      tab = "entry";
      try { localStorage.removeItem(ADMIN_SESSION_KEY); } catch(err) {}
      render();
      toast("success", "Logged out", "Administrator session ended.");
    }
    function openModal(title, body) { $("modalRoot").innerHTML = `<div class="modal-wrap" onclick="if(event.target===this)closeModal()" role="dialog" aria-modal="true"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" aria-label="Close" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div></div></div>`; }
    function closeModal() { $("modalRoot").innerHTML = ""; editingId = null; photoData = ""; }
    document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });

    function getValidationYear(student) {
      const year = String(student?.school_year || "").trim();
      return year ? year.replace(/-/g, "–") : getSchoolSettings().validationYear;
    }

    function idCard(s, back=false) {
      const school = getSchoolSettings();
      if(back) {
        return `<div class="id-card id-back">
          <img src="id-back-bg.png" alt="" class="print-id-bg">
          <div class="id-back-content">
            <div class="id-back-title">STUDENT IDENTIFICATION CARD</div>
            <div class="id-back-text">
              <p>This ID is official from (${esc(school.name)})</p>
              <p>If found, please return it to the school office. contact number (${esc(school.contact)})</p>
              <p>${esc(school.address)}, ${esc(school.location)}.</p>
              <p><b>VALIDATION:</b> ${esc(getValidationYear(s))}</p>
            </div>
          </div>
          <div class="id-back-text" style="position:absolute;left:7mm;right:7mm;bottom:1.7mm;text-align:center;font-size:5.0px;font-weight:800;line-height:1.02;z-index:3;">
            <img src="mudir-signature.png" alt="Signature Abdulnur S. JusAlun" style="display:block;width:16mm;height:5.0mm;object-fit:contain;margin:0 auto -0.2mm;">
            <span style="display:block;text-decoration:underline;">ABDULNUR S. JUSALUN</span>
            <span style="display:block;font-size:6.8px;">MUDEER</span>
          </div>
        </div>`;
      }

      return `<div class="id-card id-front">
          <img src="id-front-bg.png" alt="" class="print-id-bg">
        <div class="id-front-header">
          <span class="arabic">${esc(school.arabicName)}</span>
          <span class="school">${esc(school.name)}</span>
          <span class="reg">${esc(school.registration)}</span>
          <span class="place">${esc(school.address)}</span>
          <span class="address">${esc(school.location)}.</span>
        </div>

        <div class="id-front-body">
          <img class="id-photo" src="${esc(s.photo||"")}" alt="Student photo">
          <div class="id-student-info">
            <div class="id-field">
              <span class="label">Full Name</span>
              <span class="value">${esc(s.fullname)}</span>
            </div>
            <div class="id-field">
              <span class="label">Student No</span>
              <span class="value">${esc(s.student_no)}</span>
            </div>
            <div class="id-field-row">
              <div class="id-field">
                <span class="label">DOB</span>
                <span class="value">${esc(s.dob)}</span>
              </div>
              <div class="id-field">
                <span class="label">Contact</span>
                <span class="value">${esc(s.contact)}</span>
              </div>
            </div>
            <div class="id-field">
              <span class="label">Address</span>
              <span class="value">${esc(s.address)}</span>
            </div>
          </div>
        </div>
        <div class="id-back-text" style="position:absolute;left:7mm;right:7mm;bottom:1.7mm;text-align:center;font-size:5.0px;font-weight:800;line-height:1.02;z-index:3;">
          <img src="president-signature.png" alt="Signature Hj’ Arnel Salahuddin" style="display:block;width:16mm;height:5.0mm;object-fit:contain;margin:0 auto -0.2mm;">
          <span style="display:block;text-decoration:underline;">HJ’ARNEL SALAHUDDIN</span>
          <span style="display:block;font-size:6.8px;">PRESIDENT</span>
        </div>
          <div style="position:absolute;left:7mm;bottom:4.2mm;width:23mm;text-align:center;font-size:6.8px;font-weight:800;line-height:1.02;z-index:4;white-space:nowrap;">GENDER: ${esc(s.sex||"")}</div>
      </div>`;
    }

    /* A4 Selection & Printing */
    function openA4() {
      if(!isAdmin) { toast("info", "Admin only", "Please login as administrator first."); return; }
      a4Selected = []; 
      openModal("A4 Print Preview", `
        <div class="field floating">
          <input id="a4Search" placeholder=" " oninput="filterA4Preview()">
          <label>Search student name to add</label>
        </div>
        <div id="a4SearchResults" style="margin-top:12px; display:flex; flex-wrap:wrap; gap:8px;"></div>
        <hr style="border:0; border-top:1px solid var(--border); margin:16px 0;">
        <div id="a4preview" class="id-page">
          <div class="card empty">No students selected. Search and select names above.</div>
        </div>
        <div class="actions no-print" style="margin-top:15px">
          <button class="btn primary" onclick="printA4()" id="btnPrintA4" disabled>Print A4</button>
        </div>
      `);
    }

    function filterA4Preview() {
      const q = norm($("a4Search")?.value||"");
      const list = q ? students.filter(s => norm(s.fullname).includes(q)) : [];
      const resBox = $("a4SearchResults");
      
      if(!q) { resBox.innerHTML = ""; return; }
      if(!list.length) { resBox.innerHTML = "<small class='meta'>No matches found.</small>"; return; }

      resBox.innerHTML = list.map(s => {
        const isSel = a4Selected.find(x => x.id === s.id);
        return `<button class="btn ${isSel?'primary':''}" onclick="toggleA4('${s.id}')" style="font-size:12px; padding:6px 10px;">${isSel?'✓ ':''}${esc(s.fullname)}</button>`;
      }).join("");
    }

    function toggleA4(id) {
      const idx = a4Selected.findIndex(x => x.id === id);
      if(idx >= 0) {
        a4Selected.splice(idx, 1);
      } else {
        const s = students.find(x => x.id === id);
        if(s) a4Selected.push(s);
      }
      filterA4Preview();
      renderA4Preview();
    }

    function renderA4Preview() {
      const box = $("a4preview");
      const btn = $("btnPrintA4");
      if(!a4Selected.length) {
        box.innerHTML = `<div class="card empty">No students selected. Search and select names above.</div>`;
        if(btn) btn.disabled = true;
        return;
      }
      if(btn) btn.disabled = false;
      box.innerHTML = `<div class="a4">${a4Selected.map(s => idCard(s) + idCard(s, true)).join("")}</div>`;
    }

    function printA4() {
      const w = window.open("", "_blank");
      if(!w) { toast("error", "Print blocked", "Allow popups in your browser."); return; }
      const a = $("a4preview").innerHTML;
      const css = [...document.querySelectorAll("style")].map(s => s.textContent).join("\n");
      w.document.open();
      w.document.write(`<!doctype html><html><head><meta charset="utf-8"><base href="${document.baseURI}"><title>A4 Student ID Cards</title><style>${css}
@page{size:A4 portrait;margin:0}
html,body{width:210mm!important;margin:0!important;padding:0!important;background:#fff!important}
.id-page{padding:0!important;background:#fff!important}.a4{width:210mm!important;height:297mm!important;min-height:297mm!important;box-sizing:border-box!important;box-shadow:none!important;margin:0!important;padding:8mm 10mm!important;grid-template-rows:repeat(5,54mm)!important;grid-auto-rows:54mm!important;gap:2.5mm 8mm!important;overflow:hidden!important;page-break-after:always!important}.id-card,.id-front,.id-back{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}.print-id-bg{display:block!important;visibility:visible!important;opacity:1!important}
</style></head><body>${a}<script>(async()=>{const imgs=[...document.images];await Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=img.onerror=r;})));await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));window.focus();window.print();})();<\/script></body></html>`);
      w.document.close();
    }

    function exportCSV() {
      if(!students.length) { toast("info", "No data", "No student data available to export."); return; }
      const rows = [["No","Student No","Full Name","Date of Birth","Contact No","Grade","Address","Enrollment Fee","Balance","Scholar","Paid Status"], ...students.map((s,i) => [i+1, s.student_no, s.fullname, s.dob, s.contact, s.grade, s.address, s.enrollment, s.balance, s.scholar, s.paid])];
      const csv = rows.map(r => r.map(v => `"${String(v??"").replace(/"/g, '""')}"`).join(",")).join("\n");
      download("students.csv", "text/csv;charset=utf-8", csv);
      toast("success", "CSV exported", "File created locally.");
    }

    function exportExcel() {
      if(!students.length) { toast("info", "No data", "No student data available to export."); return; }
      const rows = students.map((s,i) => ({No:i+1, "Student No":s.student_no, "Full Name":s.fullname, "Date of Birth":s.dob, "Contact No":s.contact, Grade:s.grade, Address:s.address, "Enrollment Fee":s.enrollment, Balance:s.balance, Scholar:s.scholar, "Paid Status":s.paid}));
      if(window.XLSX) {
        const wb = XLSX.utils.book_new(), ws = XLSX.utils.json_to_sheet(rows);
        XLSX.utils.book_append_sheet(wb, ws, "Students");
        XLSX.writeFile(wb, "students.xlsx");
      } else download("students.xls", "application/vnd.ms-excel", rows.map(Object.values).join("\n"));
      toast("success", "Excel exported", "File created locally.");
    }

    function download(name, type, data) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([data], {type}));
      a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    function showFatalError(err){
      console.error("APP STARTUP ERROR", err);
      const msg = err && err.message ? err.message : String(err || "Unknown error");
      const root = document.getElementById("app");
      if(root){
        root.innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7fb;font-family:Arial,sans-serif"><div style="width:min(620px,100%);background:#fff;border:1px solid #e3e8f0;border-radius:18px;padding:24px;box-shadow:0 12px 35px rgba(28,39,65,.10)"><h2 style="margin:0 0 8px">Student Data Management System</h2><p style="margin:0 0 12px;color:#687386">The application could not start correctly.</p><pre style="white-space:pre-wrap;background:#f7f8fa;padding:12px;border-radius:10px;font-size:12px;overflow:auto">${esc(msg)}</pre><button onclick="location.reload()" style="border:0;border-radius:12px;padding:11px 15px;background:#315efb;color:#fff;font-weight:700">Reload</button></div></div>`;
      }
    }

    function bootApp(){
      try{
        isAdmin = adminSessionActive();
        if(isAdmin && (tab === "entry" || tab === "data")) tab = "dashboard";
        render();
      }catch(err){ showFatalError(err); }
    }
    window.addEventListener("error", e => {
      if(e && e.error) showFatalError(e.error);
    });
    window.addEventListener("unhandledrejection", e => {
      if(e && e.reason) showFatalError(e.reason);
    });
    if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", bootApp, {once:true});
    else bootApp();
  </script>
</body>
</html>
